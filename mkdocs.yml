site_name: Manual de PharmaToxAI
site_description: Guía práctica y reproducible para aplicar métodos QSAR a la seguridad química.
site_url: https://juanjosecas.github.io/PharmaToxAI-manual/
repo_url: https://github.com/juanjosecas/PharmaToxAI-manual
repo_name: juanjosecas/PharmaToxAI-manual
docs_dir: docs

theme:
  name: material
  language: es
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Inicio: index.md
  - Introducción:
      - Instalación: introduccion/instalacion.md
      - Gestión de entornos: introduccion/entornos.md
      - GPU: introduccion/gpu.md
      - Verificación y diagnóstico: introduccion/verificacion.md
      - Primer QSAR: introduccion/primer-qsar.md
  - Obtención de datos:
      - Fuentes y búsqueda molecular: datos/fuentes-y-busqueda.md
      - Construcción de datasets: datos/construccion-datasets.md
  - Preparación molecular (Bloque A):
      - Visión general: preparacion/index.md
      - Carga y auditoría: preparacion/carga-datos.md
      - Análisis exploratorio: preparacion/eda.md
      - Curación molecular: preparacion/curacion.md
      - Featurización: preparacion/featurizacion.md
      - Limpieza de características: preparacion/limpieza.md
      - Introducción a datasets: preparacion/datasets.md
  - Modelado (Bloque B):
      - Visión general: modelado/index.md
      - Particiones: modelado/particiones.md
      - Regresión y clasificación: modelado/entrenamiento-qsar.md
      - Deep learning: modelado/deep-learning.md
      - Fundamentos del entrenamiento: modelado/entrenamiento.md
  - Evaluación (Bloque B):
      - Métricas: evaluacion/metricas.md
      - Dominio de aplicabilidad: evaluacion/dominio-aplicabilidad.md
      - Comparación de métodos AD: evaluacion/metodos-dominio.md
      - Marco regulatorio OECD: evaluacion/marco-oecd.md
      - Validación y límites: evaluacion/validacion.md
  - Aplicaciones (Bloque C):
      - Visión general: aplicaciones/index.md
      - Persistencia de modelos: aplicaciones/persistencia.md
      - Inferencia: aplicaciones/inferencia.md
      - Clasificación multilabel: aplicaciones/multilabel.md
      - Read-across: aplicaciones/read-across.md
      - Alertas estructurales: aplicaciones/alertas.md
      - Genotoxicidad (COM G11 e ICH M7): aplicaciones/genotoxicidad-com-g11-ich-m7.md
      - Descriptores cuánticos: aplicaciones/descriptores-cuanticos.md
      - Incertidumbre: aplicaciones/incertidumbre.md
      - Informes QMRF: aplicaciones/informes-qmrf.md
  - Tutoriales:
      - Primer modelo reproducible: tutoriales/01-primer-qsar.md
      - Preparación molecular (Bloque A): tutoriales/02-preparacion-molecular.md
      - Entrenamiento y validación (Bloque B): tutoriales/03-modelado-validacion.md
      - Persistencia e inferencia (Bloque C): tutoriales/04-persistencia-inferencia-qmrf.md
  - Referencia:
      - Bibliografía: referencia/bibliografia.md
      - Fuentes del código: referencia/fuentes-del-codigo.md
